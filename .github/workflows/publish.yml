name: publish

# Releasing is `npm run bump X.Y.Z`, a "Release vX.Y.Z" commit, then an annotated vX.Y.Z tag.
# Pushing that tag runs this. The Figma plugin is published by hand; Figma has no API for it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing over OIDC, so no npm token lives in this repo

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # setup-node ships npm 10; trusted publishing needs 11.5.1+
      - run: npm ci

      - name: Tag agrees with every manifest
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json $version"; exit 1; }
          for ws in plugin bridge; do
            test "$(node -p "require('./$ws/package.json').version")" = "$version" || { echo "$ws/package.json is not $version"; exit 1; }
          done

      # Before publishing: npm versions are immutable, a missing changelog section is not.
      - name: Release notes from the CHANGELOG section
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '$0 == heading { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME, or it is empty"; exit 1; }
          # Anything still under [Unreleased] ships in this tag but not in its notes.
          if awk '$0 == "## [Unreleased]" { found = 1; next } found && /^## \[/ { exit } found && /[^[:space:]]/ { stray = 1 } END { exit !stray }' CHANGELOG.md; then
            echo "CHANGELOG.md still has entries under [Unreleased]; they belong in the $GITHUB_REF_NAME section"
            exit 1
          fi

      - run: npm run check

      # Re-running the job after a partial release finishes it: the publish is skipped once
      # that version is on the registry, and the release is created or its notes refreshed.
      - name: Publish to npm
        run: |
          version=${GITHUB_REF_NAME#v}
          if npm view "@sesori/figma-review@$version" version > /dev/null 2>&1; then
            echo "@sesori/figma-review@$version is already published; skipping"
          else
            npm publish --access public
          fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md || gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
